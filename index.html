        /* Selection */

        /* Film-grain noise overlay — fixed, non-interactive */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.035;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        }

        /* Double-Bezel utility helpers */
        .bezel-shell {
            background: rgba(44, 58, 46, 0.04);
            box-shadow: inset 0 0 0 1px rgba(44, 58, 46, 0.08), 0 1px 0 rgba(255,255,255,0.6);
            border-radius: 2rem;
            padding: 0.4rem;
        }
        .bezel-core {
            border-radius: calc(2rem - 0.4rem);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 1px 2px rgba(26,24,22,0.04);
        }

        /* Magnetic CTA pill */
        .cta-magnetic {
            transition: transform 0.5s cubic-bezier(0.32,0.72,0,1), box-shadow 0.5s cubic-bezier(0.32,0.72,0,1), background-color 0.4s ease;
        }
        .cta-magnetic:hover { transform: translateY(-2px); }
        .cta-magnetic:active { transform: scale(0.985); }
        .cta-magnetic .cta-orb {
            transition: transform 0.6s cubic-bezier(0.32,0.72,0,1);
        }
        .cta-magnetic:hover .cta-orb {
            transform: translateX(4px) translateY(-1px) rotate(-8deg);
        }

        /* Eyebrow tag */
        .eyebrow {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            font-weight: 500;
        }

        /* Hairline */
        .hairline { border-color: rgba(26,24,22,0.08); }

        /* Custom animations referenced by App.tsx */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in 0.5s cubic-bezier(0.16,1,0.3,1) both; }

        @keyframes slide-up {
            from { opacity: 0; transform: translateY(32px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.8s cubic-bezier(0.16,1,0.3,1) both; }

        /* Reveal-on-view (used via IntersectionObserver) */
        .reveal { opacity: 0; transform: translateY(28px); filter: blur(6px); transition: opacity .9s cubic-bezier(0.16,1,0.3,1), transform .9s cubic-bezier(0.16,1,0.3,1), filter .9s ease; }
        .reveal.in { opacity: 1; transform: translateY(0); filter: blur(0); }

        /* Reduce motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Marquee for trust bar */

            from { transform: translateX(0); }

    <script>
      // Lightweight scroll-reveal observer
      (function(){
        if (typeof IntersectionObserver === 'undefined') return;
        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
        }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
        const attach = () => document.querySelectorAll('.reveal:not(.in)').forEach(el => io.observe(el));
        attach();
        new MutationObserver(attach).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
